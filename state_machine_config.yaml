        dest: "cycle_stage_4"
    actions:
      - self.trigger("command_finished")

  - name: "cycle_stage_4"
    transitions:
      - trigger: "command_finished"
        dest: "cycle_stage_branch"
    actions:
      - self.trigger("command_finished")

  - name: "cycle_stage_branch"
    transitions:
      - trigger: "command_finished"
        dest: "cycle_stage_6"
    actions:
      - self.trigger("command_finished")

  - name: "cycle_stage_6"
    transitions:
      - trigger: "command_finished"
        dest: "cycle_stage_7"
    actions:
      - self.trigger("command_finished")

  - name: "cycle_stage_7"
    transitions:
      - trigger: "command_finished"
        dest: "after_cycle_stage"
    actions:
      - self.trigger("command_finished")

  # After cycle stages
  - name: "after_cycle_stage"
    transitions:
